name: flutter_scene_ode_example
description: Boxes, spheres and cylinders falling onto a floor, simulated by ODE and drawn by flutter_scene.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_scene: ^0.23.0
  flutter_scene_ode:
    path: ../
  vector_math: ^2.2.0

flutter:
  uses-material-design: true
